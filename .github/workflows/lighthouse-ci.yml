name: Lighthouse CI

on:
  pull_request:
    branches: [main, stable, homol]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: albora_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup test database
        run: |
          sleep 5
          for f in packages/db/migrations/*.sql; do
            echo "applying $f ..."
            PGPASSWORD=test_password psql -h localhost -U postgres -d albora_test -f "$f"
          done
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/albora_test
          DATABASE_URL_AGGREGATOR: postgresql://postgres:test_password@localhost:5432/albora_test

      - name: Seed test event
        run: |
          PGPASSWORD=test_password psql -h localhost -U postgres -d albora_test -c "
            WITH acct AS (
              INSERT INTO accounts (email) VALUES ('test@albora.test')
              ON CONFLICT (email) DO UPDATE SET email = EXCLUDED.email
              RETURNING id
            )
            INSERT INTO events (account_id, slug, pack_id, starts_at, ends_at, interaction_opens_at)
            SELECT id, 'casamento-joao-maria', 'casamento', NOW(), NOW() + interval '6 hours', NOW()
            FROM acct
            ON CONFLICT (slug) DO NOTHING;
          " || echo "⚠️ Seed falhou, mas continuando..."

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/albora_test
          DATABASE_URL_AGGREGATOR: postgresql://postgres:test_password@localhost:5432/albora_test
          SKIP_ENV_VALIDATION: true
          NODE_ENV: production

      - name: Start server in background
        run: |
          cd apps/web
          pnpm start &
          echo $! > server.pid
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/albora_test
          DATABASE_URL_AGGREGATOR: postgresql://postgres:test_password@localhost:5432/albora_test
          SESSION_SECRET: ci-test-secret-not-for-production-use
          R2_ACCOUNT_ID: fake-account-id
          R2_ACCESS_KEY_ID: fake-access-key
          R2_SECRET_ACCESS_KEY: fake-secret-key
          R2_BUCKET: fake-test-bucket
          PORT: 3000

      - name: Wait for server to be ready
        run: |
          npx wait-on http://localhost:3000 --timeout 60000 || (
            echo "❌ Server failed to start"
            if [ -f apps/web/server.pid ]; then
              kill $(cat apps/web/server.pid) || true
            fi
            exit 1
          )

      - name: Run Lighthouse CI
        run: |
          cd apps/web
          npx @lhci/cli@0.15.x autorun || echo "⚠️ Lighthouse CI completed with warnings"

      - name: Stop server
        if: always()
        run: |
          if [ -f apps/web/server.pid ]; then
            kill $(cat apps/web/server.pid) || true
          fi

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/
          retention-days: 30

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            const path = 'apps/web/.lighthouseci';
            
            if (fs.existsSync(path)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 🔍 Lighthouse CI Report\n\n✅ Lighthouse audit completed! Check the artifacts for detailed reports.'
              });
            }
