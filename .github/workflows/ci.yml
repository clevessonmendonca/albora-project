name: CI

on:
  push:
    branches: [main, homol, stable]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job dedicado e visível de propósito. Se os guards fossem um passo dentro
  # de "test", uma reprovação de isolamento apareceria como "testes falharam"
  # — e a diferença entre isso e "um evento leu dado de outro" é a diferença
  # entre um bug e um incidente.
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: isolamento
        run: node tools/guards/isolamento.mjs
      - name: tokens
        run: node tools/guards/tokens.mjs
      - name: dominio
        run: node tools/guards/dominio.mjs
      - name: packs
        run: node tools/guards/packs.mjs
      - name: sessao
        run: node tools/guards/sessao.mjs

  verificar:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Inclui o auto-teste de cada guard: guard sem auto-teste pode parar de
      # verificar e continuar verde.
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
