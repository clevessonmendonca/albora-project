name: Deploy staging

on:
  push:
    branches: [stable]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Workers (staging)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: apps/web
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ENV: staging
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.STAGING_R2_BUCKET }}
          RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          APP_ROOT_DOMAIN: ${{ vars.STAGING_ROOT_DOMAIN }}
      - name: Smoke (liveness)
        if: vars.STAGING_URL != ''
        run: bash scripts/ci/smoke-test.sh "${{ vars.STAGING_URL }}"
