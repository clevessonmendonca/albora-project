name: Deploy production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Workers (production)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: apps/web
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ENV: production
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.PROD_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.PROD_R2_BUCKET }}
          RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
          APP_ROOT_DOMAIN: ${{ vars.PROD_ROOT_DOMAIN }}
      - name: Health check
        if: vars.PROD_URL != ''
        run: bash scripts/ci/smoke-test.sh "${{ vars.PROD_URL }}"
      - name: Readiness
        if: vars.PROD_URL != ''
        run: curl -fsS "${{ vars.PROD_URL }}/api/health/ready"
