# Deploy — stable (manual)

# Dispara deploy OpenNext → Cloudflare Workers.
# Secrets no repositório (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# Variáveis de runtime do Worker devem estar em wrangler secrets / dashboard CF.

name: Deploy stable

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "deploy-stable" para confirmar'
        required: true
        type: string

concurrency:
  group: deploy-stable
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.confirm == 'deploy-stable'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy @albora/web
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm cf:deploy

      - name: Smoke HTTP (opcional)
        if: vars.STABLE_URL != ''
        env:
          ALVO: ${{ vars.STABLE_URL }}
        run: node tools/deploy/smoke.mjs "$ALVO"
