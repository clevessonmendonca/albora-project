name: E2E Tests

on:
  pull_request:
    branches: [main, stable, homol]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: albora_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          cd apps/web
          npx playwright install chromium webkit --with-deps

      - name: Setup test database
        run: |
          sleep 5
          for f in packages/db/migrations/*.sql; do
            echo "applying $f ..."
            PGPASSWORD=test_password psql -h localhost -U postgres -d albora_test -f "$f"
          done
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/albora_test
          DATABASE_URL_AGGREGATOR: postgresql://postgres:test_password@localhost:5432/albora_test

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/albora_test
          DATABASE_URL_AGGREGATOR: postgresql://postgres:test_password@localhost:5432/albora_test
          SKIP_ENV_VALIDATION: true

      - name: Run E2E tests
        run: |
          cd apps/web
          pnpm test:e2e
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/albora_test
          DATABASE_URL_AGGREGATOR: postgresql://postgres:test_password@localhost:5432/albora_test
          SESSION_SECRET: e2e-test-secret-not-for-production-use
          R2_ACCOUNT_ID: fake-account-id
          R2_ACCESS_KEY_ID: fake-access-key
          R2_SECRET_ACCESS_KEY: fake-secret-key
          R2_BUCKET: fake-test-bucket
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
