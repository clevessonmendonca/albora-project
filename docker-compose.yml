# Postgres local de desenvolvimento e testes de isolamento.
# Credenciais e imagem espelham o service postgres do job `isolamento` em
# .github/workflows/ci.yml. `pnpm db:up` usa `--wait`, que depende do
# healthcheck abaixo.
services:
  postgres:
    image: postgres:18-alpine
    container_name: albora-pg
    environment:
      POSTGRES_USER: albora
      POSTGRES_PASSWORD: albora
      POSTGRES_DB: albora
    ports:
      # 55432 e não 5432: a suíte de isolamento derruba e recria o schema
      # public a cada execução, e apontar isso para um Postgres de trabalho
      # rodando na porta padrão apagaria dados alheios.
      - "55432:5432"
    healthcheck:
      # Mesmo comando do CI: db:up só retorna quando pg_isready passa.
      test: ["CMD-SHELL", "pg_isready -U albora"]
      interval: 2s
      timeout: 3s
      retries: 20
