<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Albora"><title>Albora</title><defs><linearGradient id="a" gradientUnits="userSpaceOnUse" x1="32" y1="44" x2="32" y2="19"><stop offset="0" stop-color="#9E4A22"/><stop offset=".5" stop-color="#D9793C"/><stop offset="1" stop-color="#EFA463"/></linearGradient><clipPath id="hz"><rect x="0" y="0" width="64" height="43"/></clipPath><style>.arco{stroke-dasharray:65.97;stroke-dashoffset:65.97;animation:tracar .9s cubic-bezier(.3,.7,.3,1) .1s forwards}
.sobe{transform:translateY(11px);animation:subir .55s cubic-bezier(.2,.8,.3,1) .85s forwards}
.sol{transform:scale(.5);opacity:0;animation:assentar .5s cubic-bezier(.2,.9,.3,1) .95s forwards}
@keyframes tracar{to{stroke-dashoffset:0}}
@keyframes subir{to{transform:translateY(0)}}
@keyframes assentar{0%{transform:scale(.5);opacity:0}30%{opacity:1}55%{transform:scale(1.35)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.arco{animation:none;stroke-dashoffset:0}.sobe{animation:none;transform:none}.sol{animation:none;transform:none;opacity:1}.flash{animation:none;opacity:0}.nome{animation:none;opacity:1;transform:none}}</style></defs><path class="arco" d="M11 42 A21 21 0 0 1 53 42" fill="none" stroke="url(#a)" stroke-width="2.4" stroke-linecap="round"/><g clip-path="url(#hz)"><g transform="translate(32 39.4)"><g class="sobe"><circle class="sol" r="2.9" fill="#D9793C"/></g></g></g></svg>